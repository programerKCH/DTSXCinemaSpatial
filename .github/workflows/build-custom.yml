name: Build DTSXCinemaSpatial v4.4 Impact & Strike
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout DTSXCinemaSpatial repository
        uses: actions/checkout@v4
      - name: Restore standalone HDMI PCM project and source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Source | Out-Null
          [IO.File]::WriteAllBytes("StereoToSurround.jucer", [Convert]::FromBase64String(""))
          [IO.File]::WriteAllBytes("Source\PluginProcessor.cpp", [Convert]::FromBase64String(""))
          [IO.File]::WriteAllBytes("Source\PluginProcessor.h", [Convert]::FromBase64String(""))
          [IO.File]::WriteAllBytes("Source\PluginEditor.cpp", [Convert]::FromBase64String(""))
          [IO.File]::WriteAllBytes("Source\PluginEditor.h", [Convert]::FromBase64String(""))
          [IO.File]::WriteAllBytes("StereoToSurround.jucer", [Convert]::FromBase64String(""))
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Detect Windows SDK
        shell: pwsh
        run: |
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\Lib"
          $sdk = Get-ChildItem $sdkRoot -Directory | Where-Object { $_.Name -match '^10\.0\.' } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $sdk) { throw "No Windows 10/11 SDK found" }
          "WINSDK=$($sdk.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Restore JUCE + Projucer cache
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: JUCE
          key: windows-juce-5.3.2-projucer-v143-v2
      - name: Fetch JUCE 5.3.2
        if: steps.juce-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: git clone --depth 1 --branch 5.3.2 https://github.com/juce-framework/JUCE.git JUCE
      - name: Build Projucer only when missing
        shell: pwsh
        run: |
          $projucer = Get-ChildItem -Path JUCE\extras\Projucer\Builds\VisualStudio2017 -Recurse -Filter Projucer.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $projucer) {
            msbuild JUCE\extras\Projucer\Builds\VisualStudio2017\Projucer.sln /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=$env:WINSDK
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "Cached Projucer found - skipping Projucer build."
          }
      - name: Restore generated Visual Studio project
        id: project-cache
        uses: actions/cache@v4
        with:
          path: |
            Builds/VisualStudio2017
            JuceLibraryCode
          key: optical-v13-project-${{ runner.os }}-${{ hashFiles('StereoToSurround.jucer') }}
          restore-keys: |
            optical-v13-project-${{ runner.os }}-
      - name: Regenerate JUCE files and Visual Studio project
        shell: pwsh
        run: |
          $projucer = Get-ChildItem -Path JUCE\extras\Projucer\Builds\VisualStudio2017 -Recurse -Filter Projucer.exe | Select-Object -First 1
          if (-not $projucer) { throw "Projucer.exe not found" }
          & $projucer.FullName --resave StereoToSurround.jucer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "JuceLibraryCode\JuceHeader.h")) { throw "Missing JuceLibraryCode/JuceHeader.h" }
          if (-not (Test-Path "JuceLibraryCode\include_juce_audio_basics.cpp")) { throw "Missing JuceLibraryCode/include_juce_audio_basics.cpp" }
          if (-not (Test-Path "Builds\VisualStudio2017\DTSXCinemaSpatial.sln")) { throw "Missing VS solution" }
      - name: Restore incremental VST build cache
        uses: actions/cache@v4
        with:
          path: |
            Builds/VisualStudio2017/x64
            Builds/VisualStudio2017/.vs
          key: dtsxpcm-v10rc-build-${{ runner.os }}-${{ hashFiles('Source/**', 'StereoToSurround.jucer') }}
          restore-keys: |
            dtsxpcm-v10rc-build-${{ runner.os }}-
            optical-v7-build-${{ runner.os }}-
            optical-v6-build-${{ runner.os }}-
            optical-v5-build-${{ runner.os }}-
            optical-v3-build-${{ runner.os }}-
      - name: Build VST2 x64 Release
        shell: pwsh
        run: msbuild Builds\VisualStudio2017\DTSXCinemaSpatial.sln /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=$env:WINSDK
      - name: Collect DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          $dll = Get-ChildItem -Path Builds\VisualStudio2017 -Recurse -Filter DTSXCinemaSpatial.dll | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if (-not $dll) { throw "DTSXCinemaSpatial.dll not found" }
          Copy-Item $dll.FullName artifact\DTSXCinemaSpatial-v4.4-ImpactStrike.dll
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DTSXCinemaSpatial-v4.4-ImpactStrike
          path: artifact/DTSXCinemaSpatial-v4.4-ImpactStrike.dll
          if-no-files-found: error
