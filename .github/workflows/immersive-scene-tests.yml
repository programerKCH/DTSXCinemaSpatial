name: Immersive Scene Prototype Tests
on:
  push:
    branches: [experimental/immersive-spatial-v5]
  workflow_dispatch:
jobs:
  scene-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: C++14 scene core
        run: |
          set -euxo pipefail
          g++ -std=c++14 -O2 -Wall -Wextra -Werror Tests/ImmersiveSceneTests.cpp -o /tmp/ImmersiveSceneTests
          /tmp/ImmersiveSceneTests
      - name: C++14 host router
        run: |
          set -euxo pipefail
          g++ -std=c++14 -O2 -Wall -Wextra -Werror Tests/SpatialHostBridgeTests.cpp -o /tmp/SpatialHostBridgeTests
          /tmp/SpatialHostBridgeTests
      - name: C++14 Windows channel map
        run: |
          set -euxo pipefail
          g++ -std=c++14 -O2 -Wall -Wextra -Werror Tests/WindowsSpeakerMapTests.cpp -o /tmp/WindowsSpeakerMapTests
          /tmp/WindowsSpeakerMapTests
      - name: C++14 Leaf regression
        run: |
          set -euxo pipefail
          g++ -std=c++14 -O2 -Wall -Wextra -Werror Tests/LeafReferenceScenarios.cpp -o /tmp/LeafReferenceScenarios
          /tmp/LeafReferenceScenarios
      - name: C++14 Amaze regression
        run: |
          set -euxo pipefail
          g++ -std=c++14 -O2 -Wall -Wextra -Werror Tests/AmazeReferenceScenarios.cpp -o /tmp/AmazeReferenceScenarios
          /tmp/AmazeReferenceScenarios

      - name: C++14 spatial object mapper
        run: |
          set -euxo pipefail
          g++ -std=c++14 -O2 -Wall -Wextra -Werror Tests/SceneObjectMapperTests.cpp -o /tmp/SceneObjectMapperTests
          /tmp/SceneObjectMapperTests

      - name: C++14 real 5.1 WAV file reader
        run: |
          set -euxo pipefail
          g++ -std=c++14 -O2 -Wall -Wextra -Werror Tests/Float51WavReaderTests.cpp -o /tmp/Float51WavReaderTests
          /tmp/Float51WavReaderTests
      - name: C++14 real 5.1 scene export tool
        run: |
          set -euxo pipefail
          g++ -std=c++14 -O2 -Wall -Wextra -Werror Tools/SpatialSceneFromWav.cpp -o /tmp/SpatialSceneFromWav

      - name: C++14 scene classifier regressions
        run: |
          set -euxo pipefail
          g++ -std=c++14 -O2 -Wall -Wextra -Werror Tests/SceneClassifierTests.cpp -o /tmp/SceneClassifierTests
          /tmp/SceneClassifierTests

  windows-endpoint-probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile Windows WASAPI endpoint diagnostic
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /EHsc /W4 Tools/WindowsEndpointProbe.cpp /Fe:WindowsEndpointProbe.exe ole32.lib uuid.lib 2>&1 | Tee-Object -FilePath endpoint-build.log
          if ($LASTEXITCODE -ne 0) { throw "WindowsEndpointProbe compile failed ($LASTEXITCODE)" }
      - name: Compile Windows spatial object capability probe
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /EHsc /W4 Tools/WindowsSpatialCapabilityProbe.cpp /Fe:WindowsSpatialCapabilityProbe.exe ole32.lib uuid.lib 2>&1 | Tee-Object -FilePath spatial-build.log
          if ($LASTEXITCODE -ne 0) { throw "WindowsSpatialCapabilityProbe compile failed ($LASTEXITCODE)" }
      - name: Upload Windows compiler logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Probe-Build-Logs
          path: '*-build.log'
          if-no-files-found: warn
      - name: Compile spatial stream activation smoke test
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /EHsc /W4 Tools/SpatialStreamActivationSmoke.cpp /Fe:SpatialStreamActivationSmoke.exe ole32.lib uuid.lib 2>&1 | Tee-Object -FilePath stream-build.log
          if ($LASTEXITCODE -ne 0) { throw "Spatial stream smoke test compile failed ($LASTEXITCODE)" }
      - name: Upload spatial stream smoke test
        uses: actions/upload-artifact@v4
        with:
          name: SpatialStreamActivationSmoke-experimental
          path: SpatialStreamActivationSmoke.exe
      - name: Compile moving spatial object demonstration
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /EHsc /W4 Tools/SpatialMovingObjectDemo.cpp /Fe:SpatialMovingObjectDemo.exe ole32.lib uuid.lib 2>&1 | Tee-Object -FilePath moving-object-build.log
          if ($LASTEXITCODE -ne 0) { throw "Spatial moving object compile failed ($LASTEXITCODE)" }
      - name: Upload moving spatial object demonstration
        uses: actions/upload-artifact@v4
        with:
          name: SpatialMovingObjectDemo-experimental
          path: SpatialMovingObjectDemo.exe
      - name: Upload Windows endpoint diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: WindowsEndpointProbe-experimental
          path: WindowsEndpointProbe.exe
      - name: Upload spatial capability diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: WindowsSpatialCapabilityProbe-experimental
          path: WindowsSpatialCapabilityProbe.exe
