name: Immersive Scene Prototype Tests
on:
  push:
    branches: [experimental/immersive-spatial-v5]
  workflow_dispatch:
jobs:
  scene-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test scene engine
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror Tests/ImmersiveSceneTests.cpp -o /tmp/immersive-scene-tests
          /tmp/immersive-scene-tests
          g++ -std=c++17 -O2 -Wall -Wextra -Werror Tests/SpatialHostBridgeTests.cpp -o /tmp/spatial-bridge-tests
          /tmp/spatial-bridge-tests
          g++ -std=c++17 -O2 -Wall -Wextra -Werror Tests/WindowsSpeakerMapTests.cpp -o /tmp/speaker-map-tests
          /tmp/speaker-map-tests
          g++ -std=c++17 -O2 -Wall -Wextra -Werror Tests/LeafReferenceScenarios.cpp -o /tmp/leaf-reference-tests
          /tmp/leaf-reference-tests

  windows-endpoint-probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile Windows WASAPI endpoint diagnostic
        shell: cmd
        run: cl /nologo /std:c++17 /EHsc /W4 Tools\WindowsEndpointProbe.cpp /Fe:WindowsEndpointProbe.exe ole32.lib uuid.lib
      - name: Upload Windows endpoint diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: WindowsEndpointProbe-experimental
          path: WindowsEndpointProbe.exe
